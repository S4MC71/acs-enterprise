global
    log stdout format raw local0
    maxconn 1000

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option forwardfor
    option http-server-close

frontend cloud_lb_frontend
    bind *:80
    default_backend cloud_app_backend

backend cloud_app_backend
    balance roundrobin
    server cloud-app-01 172.16.0.20:8080 check
