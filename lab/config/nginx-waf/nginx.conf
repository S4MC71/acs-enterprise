events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Realistic Corporate Logging Format
    log_format enterprise_combined '$remote_addr - $remote_user [$time_local] '
                                    '"$request" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent" '
                                    'rt=$request_time uct="$upstream_connect_time" '
                                    'urt="$upstream_response_time" '
                                    'Zone=DMZ Node=srv-waf-proxy.nexus.internal';

    access_log /var/log/nginx/access.log enterprise_combined;
    error_log  /var/log/nginx/error.log warn;

    # Security Headers — Realistic Enterprise WAF
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Banner leak — intentionally reveals internal tech stack
    add_header Server "Nexus-Enterprise-Edge-WAF/4.2 (Nginx/1.25)" always;
    add_header X-Powered-By "Nexus-Infra v3.11" always;

    # Upstream: use Docker service hostname (not hardcoded IP)
    upstream dmz_web_cluster {
        server corp-web-portal:5000;
    }

    server {
        listen 80;
        server_name nexus.internal www.nexus.internal 198.51.100.10 localhost;

        # Main application proxy
        location / {
            proxy_pass http://dmz_web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Enterprise-Edge "Nexus-DMZ-Proxy-01";
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Simulated corporate robots.txt — leaks internal paths & IPs (intentional)
        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /admin-console/\nDisallow: /api/v1/\nDisallow: /api/network/\nDisallow: /internal/\n# NOTE: Internal ERP accessible at http://10.0.3.10:8000 from trusted subnets\n# IT diagnostic tools: /api/network/ping (internal use only)\n# App version: Nexus-Portal v2.4.1\n";
            add_header Content-Type "text/plain";
        }

        # Changelog — leaks internal tech stack and prior vulnerabilities
        location = /changelog.txt {
            return 200 "Nexus Portal v2.4.1 — Changelog\n================================\nv2.4.1 (2026-08-01): Fixed SQL injection in /api/search endpoint (reported by internal audit)\nv2.4.0 (2026-07-15): Added network ping diagnostic tool for BOC Gateway team\nv2.3.8 (2026-06-22): Updated server config. WAF running on 10.0.1.10 -> forwarding to 10.0.1.20:5000\nv2.3.5 (2026-05-10): Integrated internal AD auth via LDAP (dc01.nexus.internal:389)\n";
            add_header Content-Type "text/plain";
        }

        # Admin console — returns 403 but reveals it exists (social engineering bait)
        location /admin-console/ {
            return 403 "403 Forbidden — Access to Nexus Admin Console requires Domain Admin credentials.\nContact: mvance@nexus.internal or erostova@nexus.internal\n";
            add_header Content-Type "text/plain";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
