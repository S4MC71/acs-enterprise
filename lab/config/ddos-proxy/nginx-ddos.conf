events { worker_connections 1024; }

http {
    # DDoS Protection Layer — simulates Cloudflare/Akamai scrubbing center
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=ddos_global:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=ddos_strict:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ddos_conn:10m;

    log_format ddos_log '$remote_addr [$time_local] "$request" $status '
                        'req_time=$request_time limit_req=$limit_req_status '
                        'Node=ddos-scrub-01.nexus-cdn.net';

    access_log /var/log/nginx/ddos_access.log ddos_log;
    error_log  /var/log/nginx/ddos_error.log warn;

    # Realistic DDoS protection headers
    add_header X-CDN-Provider "Nexus-Shield-CDN/3.4" always;
    add_header X-Cache-Status "MISS" always;
    add_header CF-RAY "nexus-ddos-node-sg1" always;

    # Upstream: HQ BGP Dual Routers
    upstream hq_perimeter {
        server edge-router:80;
        server edge-router-b:80 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name nexus.internal *.nexus.internal;

        # Global rate limiting
        limit_req zone=ddos_global burst=100 nodelay;
        limit_conn ddos_conn 20;

        # Block common DDoS / bot patterns
        if ($http_user_agent ~* "(masscan|nmap|nikto|sqlmap|dirbuster)") {
            return 403 "Access Denied by Nexus-Shield CDN.\n";
        }

        # Challenge suspicious requests (simulate JS challenge)
        location /cdn-challenge/ {
            return 200 "Nexus-Shield CDN: Security verification in progress...\nRay-ID: nexus-${request_id}\n";
            add_header Content-Type "text/plain";
        }

        # Pass legitimate traffic to HQ
        location / {
            limit_req zone=ddos_strict burst=20 nodelay;
            proxy_pass http://hq_perimeter;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CDN-Shield "Nexus-Shield-CDN";
        }
    }
}
