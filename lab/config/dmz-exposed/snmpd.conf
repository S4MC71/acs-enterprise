# snmpd.conf — Nexus DMZ Monitoring SNMP Agent
# INTENTIONALLY VULNERABLE: public community string
# ─────────────────────────────────────────────────

# Read-only community "public" accessible from anywhere
rocommunity  public  default

# System information (leaked via sysDescr, sysContact, sysLocation)
sysdescr     Nexus Global Enterprise DMZ Monitoring Server v2.1 (Alpine Linux)
syslocation  Nexus HQ - Server Room 1A - Rack DMZ-01 - 10.0.1.60
syscontact   IT Operations <it-ops@nexus.internal> | NOC: +880-2-XXXX-0001

# Allow SNMP queries on all interfaces
agentaddress  udp:161

# Enable all MIB views (exposes interface IPs, routing table, etc.)
view   systemonly  included   .1.3.6.1.2.1.1
view   systemonly  included   .1.3.6.1.2.1.25
view   all         included   .1

# Extended MIBs — network interfaces, routing (reveals internal IPs)
roview  all

# Process table (reveals running services)
proc    vsftpd
proc    snmpd
proc    postgres
proc    telnetd
