# vsftpd.conf — Nexus DMZ Monitoring FTP Server
# INTENTIONALLY VULNERABLE: Anonymous login enabled
# ─────────────────────────────────────────────────

# Anonymous access (no password)
anonymous_enable=YES
no_anon_password=YES
anon_root=/var/ftp

# Disable local user login
local_enable=NO
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# Passive mode config (PASV_PLACEHOLDER replaced by start.sh)
listen=YES
listen_ipv6=NO
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=PASV_PLACEHOLDER
pasv_promiscuous=YES

# Logging
xferlog_enable=YES
xferlog_std_format=YES
log_ftp_protocol=NO

# Banner (realistic corporate banner)
ftpd_banner=Nexus Global Enterprise FTP Server - Authorized Access Only
