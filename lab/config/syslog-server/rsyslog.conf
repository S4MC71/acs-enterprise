# Rsyslog Configuration for Nexus Enterprise SIEM Collector
# Node: siem-soc-01.nexus.internal (10.0.2.99)

# Global directives
global(workDirectory="/var/spool/rsyslog")
module(load="immark" interval="600")
module(load="imuxsock")
module(load="imudp")
module(load="imtcp")

# Listen on UDP 514 for syslog from firewall, nginx, workstations
input(type="imudp" port="514")
input(type="imtcp" port="514")

# Log format with full timestamp and hostname
$template NexusLogFormat,"%TIMESTAMP% %HOSTNAME% %syslogtag%%msg%\n"
$template NexusAlertFormat,"[ALERT] %TIMESTAMP% HOST:%HOSTNAME% PROG:%syslogtag% MSG:%msg%\n"

# Main log destination
$template NexusMain,"/var/log/nexus-syslog/nexus-all.log"
*.* action(type="omfile" DynaFile="NexusMain" Template="NexusLogFormat")

# Firewall block events get their own file (for Blue-Team analysis)
:msg, contains, "HQ-FW-BLOCKED" action(type="omfile" file="/var/log/nexus-alerts/firewall-blocks.log" Template="NexusAlertFormat")
:msg, contains, "BLOCKED"        action(type="omfile" file="/var/log/nexus-alerts/waf-blocks.log"      Template="NexusAlertFormat")
:msg, contains, "AUTH_FAIL"      action(type="omfile" file="/var/log/nexus-alerts/auth-failures.log"   Template="NexusAlertFormat")
:msg, contains, "SQL"            action(type="omfile" file="/var/log/nexus-alerts/sql-events.log"       Template="NexusAlertFormat")

# Keep facility-based logging
auth,authpriv.*     /var/log/nexus-syslog/auth.log
kern.*              /var/log/nexus-syslog/kern.log
*.emerg             :omusrmsg:*
