; pjsip.conf — PJSIP SIP accounts for Nexus VoIP PBX
; Replaces sip.conf for modern Asterisk
; Weak passwords intentional for SIP brute-force lab scenario

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Extension 1001 — Marcus Vance (CISO)
[1001]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=nexus1001

[1001]
type=aor
max_contacts=1

