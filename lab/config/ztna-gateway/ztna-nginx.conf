events { worker_connections 512; }
http {
    add_header Server "Nexus-ZTNA-Gateway/1.0" always;
    add_header X-ZTNA-Policy "zero-trust-enforced" always;

    server {
        listen 8443;
        location / {
            return 200 '{"service":"Nexus ZTNA Gateway","version":"1.0","policy":"zero-trust","auth":"WireGuard+MFA","wg_port":51820,"status":"active","hint":"Pre-shared key may be in branch SD-WAN config"}\n';
            add_header Content-Type "application/json";
        }
        location /health { return 200 "OK\n"; }
    }
}
